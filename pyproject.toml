[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmda-analyzer"
version = "0.6.1"
description = "HMDA mortgage lending disparity analyzer — denial rates, racial disparities, lending deserts, and lender benchmarking"
readme = "README.md"
# SINGLE SOURCE OF THE SUPPORT CLAIM. There are deliberately no
# `Programming Language :: Python :: X.Y` classifiers: a second list of
# supported versions is a second thing to keep in step with the CI matrix, and
# nothing reads it. Anyone adding classifiers here takes on that synchronisation
# job, and should add a gate for it at the same time.
# Restored to 0.5.0's floor in 0.6.1. Nothing in the package needs 3.11 — no
# `match`, no `tomllib`, no `Self`, no `ExceptionGroup`, no
# `date.fromisoformat`. The 3.11 floor was set by convention in 0.6.0 and it
# stranded 3.9/3.10 users on releases carrying both defects 0.6.0 fixed.
requires-python = ">=3.9"
license = "MIT"
# Portfolio-wide metadata item. Absent through 0.5.0, so every published
# hmda-analyzer release carried no author: PyPI rendered the Author field empty
# and `twine check` had nothing to show. Matches the form nmtc-mapper ships.
authors = [{name = "Jay Patel", email = "thejaypatel1511@gmail.com"}]
dependencies = [
    "pandas>=1.4.0",
    "numpy>=1.21.0",
    "requests>=2.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/Jaypatel1511/hmda-analyzer"

[tool.setuptools.packages.find]
where = ["."]
include = ["hmda_analyzer*", "hmdaanalyzer*"]

[tool.setuptools.package-data]
"hmdaanalyzer.methodology" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "live: marks tests that require live CFPB API access (deselect with -m 'not live')",
]
# A parametrized test whose argument list comes out EMPTY is silently marked
# skipped by default, and a skip exits 0. That is the same vacuity class the
# release gates exist to close: the test reports success while asserting
# nothing. fail_at_collect turns "Empty parameter set in 'test_x'" into a
# collection ERROR, so a generator that stops finding inputs fails loudly
# instead of quietly certifying nothing.
empty_parameter_set_mark = "fail_at_collect"
